<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#c8a24a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- シンボル「I」+ 上昇チャートライン -->
  <!-- Iのセリフ柱 -->
  <path d="M12 18 h14 v5 h-4.5 v24 h4.5 v5 h-14 v-5 h4.5 v-24 h-4.5 z" fill="url(#goldGrad)" />
  <!-- ジグザグ上昇ライン -->
  <path d="M16 43 L28 32 L36 38 L50 20" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- チャート先端のドット -->
  <circle cx="53" cy="17" r="3.2" fill="url(#goldGrad)" />

  <!-- SHIDA テキスト (深みのあるネイビー) -->
  <text x="58" y="47" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="34" font-weight="600" fill="#0f1e3a" letter-spacing="1.5">SHIDA</text>

  <!-- 区切り縦線 -->
  <line x1="202" y1="22" x2="202" y2="48" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- TRADE MENTAL COACH サブテキスト (ゴールド) -->
  <text x="218" y="38" font-family="'Noto Sans JP', 'Montserrat', sans-serif" font-size="10.5" font-weight="600" fill="#c8a24a" letter-spacing="2.2">TRADE MENTAL COACH</text>
</svg>
